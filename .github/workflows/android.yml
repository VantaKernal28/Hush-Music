name: Android Release APK

on:
  push:
    branches:
      - main
      - beta-1.1
      - 'beta-*'
  workflow_dispatch:

jobs:
  build-prod-release:
    name: Android Phone Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release Phone APK
      run: ./gradlew :app:assembleProdRelease

    - name: Ensure All APKs are Signed & Installable
      run: |
        APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
        for apk in app/build/outputs/apk/prod/release/*.apk; do
          [ -f "$apk" ] || continue
          echo "Inspecting $apk..."
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            if ! "$APKSIGNER" verify "$apk" 2>/dev/null; then
              echo "Signing $apk with debug keystore to make it installable..."
              "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android "$apk"
            fi
            "$APKSIGNER" verify --verbose "$apk" || true
          fi
        done

    - name: Upload Hush Music Phone APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HushMusic-v1.1-beta-release
        path: app/build/outputs/apk/prod/release/*.apk
