<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hush Music · Multi-Device Interactive Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --hush-sunset: #FF6E40;
      --hush-peach: #FFAB91;
      --hush-lavender: #B388FF;
      --hush-violet: #7E57C2;
      --hush-amoled: #0A0A0C;
      --hush-charcoal: #121214;
      --hush-surface: #1E1E24;
      --hush-card: #26262E;
      --hush-text: #FFFFFF;
      --hush-subtext: rgba(255, 255, 255, 0.65);
      --hush-gradient: linear-gradient(135deg, #FF6E40 0%, #FFAB91 50%, #B388FF 100%);
      --accent-active: #FF6E40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #060608;
      color: var(--hush-text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Dev Bar */
    header.dev-bar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(10, 10, 12, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--hush-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 110, 64, 0.35);
    }

    .brand-name {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.3px;
      background: var(--hush-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-fidelity {
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 110, 64, 0.15);
      color: var(--hush-peach);
      border: 1px solid rgba(255, 110, 64, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .segmented-control {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 3px;
      gap: 3px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--hush-subtext);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .seg-btn:hover {
      color: #fff;
    }

    .seg-btn.active {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .screen-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .screen-pill-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .screen-pill-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .screen-pill-btn.active {
      background: var(--hush-sunset);
      border-color: var(--hush-sunset);
      color: #000;
      font-weight: 700;
    }

    /* Main Container */
    main.viewport-canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 50% 20%, rgba(255, 110, 64, 0.08) 0%, transparent 60%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Quad Grid Container */
    .quad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1700px;
      align-items: start;
      justify-items: center;
    }

    .device-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .device-meta-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--hush-subtext);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-meta-label span.spec {
      font-family: 'JetBrains Mono', monospace;
      color: var(--hush-peach);
      background: rgba(255, 110, 64, 0.1);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* ==========================================================================
       DEVICE FRAMES
       ========================================================================== */

    /* 1. PHONE (390 x 844) */
    .frame-phone {
      width: 390px;
      height: 844px;
      border-radius: 48px;
      background: var(--hush-amoled);
      border: 11px solid #1c1c22;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }
    .phone-notch .lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0d0d15;
      border: 1px solid #232330;
    }

    /* 2. TABLET (1024 x 768 scaled down 0.7x for fit) */
    .frame-tablet {
      width: 860px;
      height: 645px;
      border-radius: 32px;
      background: var(--hush-amoled);
      border: 12px solid #1a1a20;
      box-shadow: 0 30px 70px rgba(0,0,0,0.85), 0 0 0 2px rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* 3. ANDROID TV (1920 x 1080 scaled down to fit standard viewport) */
    .frame-tv {
      width: 960px;
      height: 540px;
      border-radius: 14px;
      background: var(--hush-amoled);
      border: 14px solid #16161c;
      border-bottom: 24px solid #121216;
      box-shadow: 0 40px 90px rgba(0,0,0,0.9), 0 0 0 2px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 4. WEAR OS WATCH (454 x 454 Circle) */
    .frame-watch {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #000000;
      border: 10px solid #1e1e26;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Screen Layer Content */
    .screen-root {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #0A0A0C;
    }
    .screen-root::-webkit-scrollbar {
      display: none;
    }

    /* ==========================================================================
       SCREENS: ONBOARDING, HOME, NOW PLAYING, JAM SHEET
       ========================================================================== */

    /* Dynamic Multi-Stop Sunset Mesh Gradient Backdrop */
    .mesh-gradient-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 20%, rgba(255, 110, 64, 0.45) 0%, transparent 45%),
                  radial-gradient(circle at 90% 30%, rgba(255, 171, 145, 0.40) 0%, transparent 40%),
                  radial-gradient(circle at 50% 85%, rgba(179, 136, 255, 0.35) 0%, transparent 55%),
                  #0A0A0C;
      z-index: 1;
      pointer-events: none;
      animation: meshPulse 12s ease-in-out infinite alternate;
    }

    @keyframes meshPulse {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.04) translate(-1%, 2%); }
      100% { transform: scale(1.02) translate(1%, -1%); }
    }

    .screen-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 44px; /* Phone safe area top */
      padding-bottom: 24px;
    }

    /* --- ONBOARDING FLOW --- */
    .onboarding-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0 24px;
    }

    .step-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }
    .step-seg {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s;
    }
    .step-seg.active {
      background: #FFFFFF;
    }

    .brand-reveal-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: var(--hush-gradient);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(255, 110, 64, 0.4);
      margin-bottom: 20px;
      animation: brandGlow 2.4s ease-in-out infinite alternate;
    }

    @keyframes brandGlow {
      0% { transform: scale(0.96); box-shadow: 0 8px 24px rgba(255, 110, 64, 0.3); }
      100% { transform: scale(1.04); box-shadow: 0 14px 40px rgba(179, 136, 255, 0.5); }
    }

    .onboard-title {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .onboard-subtitle {
      font-size: 14.5px;
      line-height: 21px;
      color: var(--hush-subtext);
      margin-bottom: 22px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: auto;
    }
    .feat-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feat-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 110, 64, 0.18);
      color: var(--hush-sunset);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feat-card h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .feat-card p {
      font-size: 12px;
      color: var(--hush-subtext);
    }

    /* Onboarding Step 2: Name Input */
    .input-wrapper {
      margin-top: 18px;
      position: relative;
    }
    .name-input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .name-input-field:focus {
      border-color: var(--hush-sunset);
      box-shadow: 0 0 0 4px rgba(255, 110, 64, 0.2);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Onboarding Step 3: Genre & Accent Chips */
    .chip-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .genre-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .genre-chip.selected {
      background: var(--hush-gradient);
      color: #000;
      border-color: var(--hush-peach);
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 110, 64, 0.35);
    }

    .accent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .accent-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .accent-card.active {
      border: 2px solid var(--accent-active);
      background: rgba(255, 255, 255, 0.14);
    }
    .accent-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .accent-card span {
      font-size: 10px;
      color: var(--hush-subtext);
      text-align: center;
    }

    .btn-pill-primary {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      background: #FFFFFF;
      color: #000000;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-pill-primary:hover {
      transform: scale(1.02);
    }
    .btn-pill-primary:active {
      transform: scale(0.98);
    }

    /* --- HOME SCREEN --- */
    .home-header {
      padding: 0 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .home-header h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #fff;
    }

    .category-pills-row {
      display: flex;
      gap: 8px;
      padding: 0 16px 14px;
      overflow-x: auto;
    }
    .category-pills-row::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--hush-subtext);
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--accent-active);
      color: #000;
      font-weight: 700;
    }

    /* Spotify 2-Column Recents Grid */
    .recents-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 16px 20px;
    }
    .recent-tile {
      background: #202026;
      border-radius: 6px;
      display: flex;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.18s;
      height: 54px;
    }
    .recent-tile:hover {
      background: #2a2a34;
    }
    .recent-art {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      background: var(--hush-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }
    .recent-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
      padding: 0 8px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .shelf-section {
      padding: 0 16px 18px;
    }
    .shelf-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .shelf-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .shelf-carousel::-webkit-scrollbar { display: none; }
    .shelf-card {
      width: 130px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .shelf-card-art {
      width: 130px;
      height: 130px;
      border-radius: 10px;
      background: #26262E;
      margin-bottom: 6px;
      overflow: hidden;
      position: relative;
    }
    .shelf-card-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .shelf-card-title {
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shelf-card-sub {
      font-size: 11px;
      color: var(--hush-subtext);
    }

    /* Floating Docked Mini-Player */
    .mini-player-bar {
      margin: auto 12px 64px 12px; /* Positioned directly above bottom nav */
      height: 54px;
      border-radius: 27px;
      background: rgba(28, 28, 34, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      padding: 6px 14px 6px 8px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .mini-art {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--hush-gradient);
      flex-shrink: 0;
      margin-right: 10px;
    }
    .mini-info {
      flex: 1;
      overflow: hidden;
    }
    .mini-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-artist {
      font-size: 11.5px;
      color: var(--hush-subtext);
    }
    .jam-pill-indicator {
      background: rgba(255, 110, 64, 0.2);
      border: 1px solid rgba(255, 110, 64, 0.4);
      color: var(--hush-peach);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .jam-pill-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--hush-sunset);
      animation: dotPulse 1.2s infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Floating Translucent Bottom Nav */
    .bottom-nav-bar {
      position: absolute;
      bottom: 12px;
      left: 20px;
      right: 20px;
      height: 48px;
      border-radius: 24px;
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8E8E93;
      font-size: 10.5px;
      font-weight: 600;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .nav-item:active {
      transform: scale(0.92);
    }
    .nav-item.active {
      color: #FF5722;
      font-weight: 700;
    }

    /* --- NOW PLAYING SCREEN --- */
    .now-playing-page {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }
    .np-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .np-top-bar span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--hush-subtext);
    }
    .np-art-box {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      background: var(--hush-gradient);
      box-shadow: 0 20px 45px rgba(255, 110, 64, 0.35);
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .np-track-meta {
      margin-bottom: 18px;
    }
    .np-track-meta h2 {
      font-size: 23px;
      font-weight: 800;
      color: #fff;
    }
    .np-track-meta p {
      font-size: 15px;
      color: var(--hush-subtext);
    }

    .scrubber-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      margin-bottom: 6px;
      position: relative;
    }
    .scrubber-progress {
      width: 48%;
      height: 100%;
      background: var(--accent-active);
      border-radius: 2px;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--hush-subtext);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 20px;
    }

    .transport-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .btn-play-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FFFFFF;

          </div>
          <div class="device-container">
            <div class="device-meta-label"><span>⌚ Wear OS Circle</span> <span class="spec">454×454</span></div>
            ${renderWatchScreen()}
          </div>
        `;
      }
    }

    // Helper functions for interactive events
    window.openScreen = function(screenName) {
      state.screen = screenName;
      updateScreenPills(screenName);
      render();
    };

    window.toggleGenre = function(genre) {
      if (state.selectedGenres.has(genre)) {
        state.selectedGenres.delete(genre);
      } else {
        state.selectedGenres.add(genre);
      }
      render();
    };

    window.setAccent = function(accentKey, colorHex) {
      state.themeAccent = accentKey;
      document.documentElement.style.setProperty('--accent-active', colorHex);
      render();
    };

    function updateScreenPills(screenName) {
      document.querySelectorAll('#screenSwitcher .screen-pill-btn').forEach(btn => {
        if (btn.dataset.screen === screenName) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // Initial render
    render();
  </script>
</body>
</html>
